<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>FT8-33 Hi-Fi UI - 48 screens × 3 breakpoints</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
  header { background: #0f172a; color: #fff; padding: 20px 32px; position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12px; color: #94a3b8; }
  main { padding: 24px 32px; }
  .screen { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 24px; overflow: hidden; }
  .screen h2 { margin: 0; padding: 12px 16px; font-size: 14px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
  .imgs { display: flex; gap: 12px; padding: 16px; align-items: flex-start; overflow-x: auto; }
  .imgs figure { margin: 0; flex: 0 0 auto; text-align: center; }
  .imgs figcaption { font-size: 11px; color: #64748b; margin-top: 6px; }
  .imgs img { border: 1px solid #cbd5e1; border-radius: 4px; }
  .desktop img { width: 560px; }
  .tablet img { width: 380px; }
  .mobile img { width: 200px; }
</style>
</head>
<body>
<header>
  <h1>FT8-33 Hi-Fi UI - 48 screens × 3 breakpoints (Desktop 1440 · Tablet 768 · Mobile 375)</h1>
  <p>docs/SDD/design-system/ui/out/ · shadcn/ui style · FamilyConnect design tokens</p>
</header>
<main id="gallery"></main>
<script>
  const dirs = ["desktop", "tablet", "mobile"];
  const labels = { desktop: "Desktop 1440", tablet: "Tablet 768", mobile: "Mobile 375" };
  const files = [
    ["PUB-01","Landing page"],["PUB-02","Đăng nhập"],["PUB-03","Đăng ký"],["PUB-04","Quên / đặt lại mật khẩu"],
    ["PUB-05","Kích hoạt tài khoản"],["SHL-01","Layout chính (shell)"],["SHL-02","Trang chủ tổng quan"],["SHL-03","Tìm kiếm toàn cục"],
    ["GEN-01","Cây gia phả (thế hệ)"],["GEN-02","Đồ thị quan hệ"],["GEN-03","Tra cứu quan hệ"],["GEN-04","Hồ sơ thành viên"],
    ["GEN-05-06","Thêm thành viên & quan hệ"],["FAM-01","Tạo gia đình"],["FAM-02","Thông tin gia đình"],["FAM-03","Quản lý nhánh"],
    ["FAM-04","Danh sách thành viên"],["FAM-05","Xác thực yêu cầu"],["COM-01","Luồng cộng đồng"],["COM-02","Chi tiết bài viết"],
    ["COM-03","Tạo bài viết"],["COM-04","Tin gia đình"],["COM-05","Tạo thông báo"],["EVT-01","Danh sách sự kiện + lịch"],
    ["EVT-02","Chi tiết sự kiện + RSVP"],["EVT-03","Tạo / sửa sự kiện"],["EVT-04","Quản lý người tham gia"],["EVT-05","Thư viện ảnh sự kiện"],
    ["DIR-01","Danh bạ thành viên"],["DIR-02","Hồ sơ nghề nghiệp"],["DIR-03","Tìm kiếm nâng cao"],["HER-01","Kho lưu trữ số"],
    ["HER-02","Tư liệu lịch sử"],["HER-03","Câu chuyện gia đình"],["HER-04","Thành viên tiêu biểu"],["HER-05","Thư viện ảnh gia đình"],
    ["AI-01","Trợ lý tri thức"],["AI-02","Kết quả tìm kiếm ngữ nghĩa"],["DSH-01","Thống kê gia đình"],["DSH-02","Nhân khẩu + sự kiện"],
    ["DSH-03","Tạo / xuất báo cáo"],["ADM-01","Admin dashboard"],["ADM-02","Quản lý người dùng"],["ADM-03","Kiểm duyệt nội dung"],
    ["ADM-04","Nhật ký kiểm toán"],["ADM-05","Sao lưu & phục hồi"],["ADM-06","Cấu hình hệ thống"],["PRF-01-02-03","Hồ sơ · Thông báo · Lịch sử"]
  ];
  document.getElementById("gallery").innerHTML = files.map(([f, t]) => `
    <section class="screen"><h2>${f} · ${t}</h2><div class="imgs">
      ${dirs.map(d => `<figure class="${d}"><img src="out/${d}/${f}.png" alt="${f} ${d}"><figcaption>${labels[d]}</figcaption></figure>`).join("")}
    </div></section>`).join("");
</script>
</body>
</html>
